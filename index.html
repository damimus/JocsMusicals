<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DamiJocs</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:linear-gradient(135deg,#eaf4ff,#f8fbff);overflow:auto}
#menu{width:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
#menu h1{margin:0 0 10px;font-size:clamp(32px,5vw,58px);color:#1e40af;text-align:center}
#menu p{margin:0 0 35px;font-size:clamp(17px,2.2vw,24px);color:#64748b;text-align:center}
.juegos{width:min(100%,1250px);display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:20px}
.juego-btn{border:0;border-radius:28px;padding:42px 28px;min-height:250px;cursor:pointer;background:white;box-shadow:0 12px 35px rgba(0,0,0,.12);transition:.2s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.juego-btn:hover{transform:translateY(-6px);box-shadow:0 18px 45px rgba(0,0,0,.18)}
.icono{font-size:clamp(55px,7vw,90px);margin-bottom:18px}
.nombre{font-size:clamp(24px,3vw,36px);font-weight:800;color:#1f2937}
.desc{margin-top:12px;font-size:clamp(15px,1.8vw,19px);color:#64748b;text-align:center;line-height:1.4}
#morseBtn{border:4px solid #bfdbfe}
#ritmoBtn{border:4px solid #bbf7d0}
#midiBtn{border:4px solid #fde68a}
#damiBtn{border:4px solid #ddd6fe}
#juego{display:none;width:100%;height:100%;position:relative}
#juegoFrame{width:100%;height:100%;border:0;display:block}
#volver{position:fixed;z-index:99999;top:12px;left:12px;border:0;border-radius:12px;padding:10px 16px;background:rgba(17,24,39,.88);color:white;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.2)}
#volver:hover{background:#111827}
@media(max-width:900px){.juegos{grid-template-columns:repeat(2,minmax(220px,1fr));gap:18px}}\n@media(max-width:600px){#menu{height:auto;min-height:100%;padding:18px}.juegos{grid-template-columns:1fr;gap:14px;max-width:500px}.juego-btn{min-height:190px;padding:25px}.icono{font-size:58px;margin-bottom:10px}}
</style>
</head>
<body>

<section id="menu">
<h1>🎵 JocsMusicals</h1>
<p>Elige el juego que quieres utilizar</p>
<div class="juegos">
<button id="morseBtn" class="juego-btn" onclick="abrirJuego('morse')">
<div class="icono">📡</div><div class="nombre">Morse Musical</div>
<div class="desc">Convierte palabras en código Morse, ritmo y melodía.</div>
</button>
<button id="ritmoBtn" class="juego-btn" onclick="abrirJuego('ritmo')">
<div class="icono">🥁</div><div class="nombre">Juego de Ritmo</div>
<div class="desc">Trabaja figuras, colores, divisiones, pads y metrónomo.</div>
</button>
<button id="midiBtn" class="juego-btn" onclick="abrirJuego('midi')">
<div class="icono">🎹</div><div class="nombre">MIDI Hero</div>
<div class="desc">Juego musical interactivo para practicar con MIDI.</div>
</button>
<button id="damiBtn" class="juego-btn" onclick="abrirDamiJoc()">
<div class="icono">🎮</div><div class="nombre">DamiJoc</div>
<div class="desc">Accede a los juegos musicales de DamiJoc.</div>
</button>
<button id="puntoBtn" class="juego-btn" onclick="abrirJuego('punto')" style="border:4px solid #bbf7d0">
<div class="icono">🎼</div><div class="nombre">Punto Musical</div>
<div class="desc">Explora notas y melodías con el ratón o el dedo.</div>
</button>
<button id="atrapaBtn" class="juego-btn" onclick="abrirJuego('atrapa')" style="border:4px solid #fbcfe8">
<div class="icono">🥁</div><div class="nombre">Atrapa el Ritmo</div>
<div class="desc">Practica figuras rítmicas, tempo y coordinación con pads.</div>
</button>
</div>
</section>

<section id="juego">
<button id="volver" onclick="volverMenu()">← Menú principal</button>
<iframe id="juegoFrame" title="Juego musical"></iframe>
</section>

function abrirDamiJoc() {
  window.open("https://damimus.github.io/Damimus/", "_blank", "noopener,noreferrer");
}

function decodificarBase64UTF8(cadena) {
  const bytes = Uint8Array.from(atob(cadena), c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

function abrirJuego(nombre) {
  const frame = document.getElementById("juegoFrame");
  document.getElementById("menu").style.display = "none";
  document.getElementById("juego").style.display = "block";

  frame.srcdoc = decodificarBase64UTF8(datos[nombre]);

  frame.onload = function() {
    try {
      frame.contentWindow.focus();
    } catch(e) {}
  };
}

function volverMenu() {
  const frame = document.getElementById("juegoFrame");
  frame.srcdoc = "";
  document.getElementById("juego").style.display = "none";
  document.getElementById("menu").style.display = "flex";
}
</script>
